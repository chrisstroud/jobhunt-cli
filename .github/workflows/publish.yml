# Publishes the `jobhunt` package to npm with build provenance (#1263).
# Trigger: push a tag `vX.Y.Z` that equals cli/package.json's version. Nothing else publishes.
# The only secret is NPM_TOKEN (a publish-scoped automation token, set in this repo's Actions secrets).
name: Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish   # require a reviewer in repository settings so a tag alone cannot publish
    permissions:
      contents: read
      id-token: write          # lets npm sign the provenance statement for this exact run
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          registry-url: 'https://registry.npmjs.org'
      - name: Tag must match the package version
        run: |
          version="$(node -p "require('./cli/package.json').version")"
          test "refs/tags/v${version}" = "${GITHUB_REF}" || { echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run pack:smoke
      - name: Publish with provenance
        working-directory: cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Record checksum and source revision
        run: |
          npm view "jobhunt@$(node -p "require('./cli/package.json').version")" dist.integrity dist.shasum >> "$GITHUB_STEP_SUMMARY"
          echo "Source revision: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
